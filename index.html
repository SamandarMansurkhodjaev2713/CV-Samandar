<!DOCTYPE html>
<html lang="ru" data-density="regular" data-type="editorial">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1F1E1B" />
  <title>Samandar — Executive AI Code Lab</title>
  <meta name="description" content="Full-stack Developer · AI Automation · Product Engineer. Production-grade web apps, AI workflows, Telegram bots, and admin systems." />

  <!-- Fonts: Geist (display) + Inter (body) + JetBrains Mono (code) + Instrument Serif (em accents) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@300;400;500;600&display=swap" />

  <!-- Pre-warm the Spline runtime + scene CDN so the robot pops in faster -->
  <link rel="preconnect" href="https://unpkg.com" crossorigin />
  <link rel="preconnect" href="https://prod.spline.design" crossorigin />

  <!-- ════════════════════════════════════════════════════════════════════
       v51 — restructured paths. All app code lives under src/:
         src/styles/   — CSS bundles
         src/engine/   — bg-fx + scene + scene-cinema + themes + motion
         src/robot/    — Spline runtime wrapper + legacy fallback
         src/widgets/  — interactive widgets (estimator, cli cinema)
         src/components/ — React components + main app shell
         src/content/  — i18n content
       Vendor libs (Three / React / Babel) remain in /vendor.
       ═══════════════════════════════════════════════════════════════════ -->

  <!-- Stylesheets -->
  <link rel="stylesheet" href="src/styles/styles.css?v=55" />
  <link rel="stylesheet" href="src/styles/sections.css?v=55" />
  <link rel="stylesheet" href="src/styles/cursor.css?v=55" />
  <link rel="stylesheet" href="src/styles/cv-doc.css?v=55" />
  <link rel="stylesheet" href="src/styles/features.css?v=55" />

  <!-- Three.js r128 -->
  <script src="vendor/three.min.js"></script>

  <!-- React 18.3.1 — PRODUCTION builds (~142 KB vs ~1.2 MB dev). The JSX
       is pre-compiled to plain JS by build.js, so babel-standalone is no
       longer loaded in the browser (saved ~3 MB + the in-page transpile). -->
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <!-- Content + i18n -->
  <script src="src/content/content.js?v=55"></script>

  <!-- Engine: theming, theme transition, motion observers, background WebGL,
       view transitions. (scene-engine.js removed in v55 — it was never
       instantiated, ~48 KB of dead weight.) -->
  <script src="src/engine/themes.js?v=55"></script>
  <script src="src/engine/theme-transition.js?v=55"></script>
  <script src="src/engine/motion.js?v=55"></script>
  <script src="src/engine/bg-fx.js?v=55"></script>
  <script src="src/engine/scene-cinema.js?v=55"></script>

  <!-- Robot: Spline runtime + hand-built fallback -->
  <script src="src/robot/robot.js?v=55"></script>
  <script src="src/robot/robot-spline.js?v=55"></script>

  <!-- Interactive widgets: cursor constellation playground + system.live CLI cinema -->
  <script src="src/widgets/cursor-constellation.js?v=55"></script>
  <script src="src/widgets/cli-cinema.js?v=55"></script>

  <!-- Components + app — PRE-COMPILED plain JS (generated by build.js from
       the .jsx sources). After editing any .jsx, run `node build.js`. -->
  <script src="src/components/tweaks-panel.js?v=55"></script>
  <script src="src/components/components-1.js?v=55"></script>
  <script src="src/components/components-2.js?v=55"></script>
  <script src="src/components/app.js?v=55"></script>
</body>
</html>
