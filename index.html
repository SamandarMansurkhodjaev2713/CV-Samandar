  <!-- Intro curtain: paint a solid warm panel over the page on frame 0 so there
       is no flash of hero before the "Boot Sequence" loader (percentage +
       CORE.AI status while the real application loads underneath — see
       src/engine/intro.js).
       LCP text (h1/CTA) still renders underneath (occluded, not delayed: the
       element IS painted, the LCP timestamp is unaffected by being visually
       covered while loading). -->
  <script>
  (function () {
    try {
      // Deep-link entry — a fresh load carrying a #section or #proj-<slug> hash
      // (returning from a product landing, or any shared section link). Skip the
      // boot loader entirely and let the app scroll to the target: bg-fx.js
      // gates ONLY on this panel being live in the DOM
      // (window.__SM_INTRO.panel), so simply never creating it makes them run
      // immediately — matching pre-intro behavior, no sm:intro-done needed.
      if (window.location && window.location.hash && window.location.hash.length > 1) return;
      // Show the intro on EVERY full page load (incl. reload) — deliberately
      // NOT once-per-session. It used to gate on sessionStorage["sm_intro_seen"],
      // but that flag survives reloads (even hard reloads), so after the first
      // visit the intro silently never appeared again in that tab — which read
      // as "the intro is broken / doesn't show". This is a single-page site
      // (anchor links don't reload), so per-load only fires on a genuine fresh
      // load, and the intro is skippable (click/scroll/key), so re-showing it
      // is cheap. The whole thing is still gated by reduced-motion / low-tier
      // into the cheap fade mode below.
      var mm = window.matchMedia;
      var reduced = mm && mm("(prefers-reduced-motion: reduce)").matches;
      // Inline tier heuristic — themes.js (getDeviceTier) hasn't loaded yet at
      // this point, so this duplicates its thresholds (cores<=4 || mem<=4).
      // Keep in sync with src/engine/themes.js DEVICE_TIER_*_THRESHOLD.
      // Some hardened/privacy browsers deliberately omit `navigator`. Treat
      // that as an unknown capable device instead of aborting the entire intro.
      var nav = (typeof navigator !== "undefined" && navigator) ? navigator : {};
      var cores = (nav.hardwareConcurrency | 0) || 8;
      var mem = (typeof nav.deviceMemory === "number") ? nav.deviceMemory : 8;
      var lowTier = cores <= 4 || mem <= 4;
      var panel = document.createElement("div");
      panel.id = "sm-intro";
      panel.setAttribute("aria-hidden", "true");
      panel.setAttribute("data-intro-mode", (reduced || lowTier) ? "fade" : "full");
      panel.style.cssText =
        "position:fixed;inset:0;z-index:2147483000;background:#1F1E1B;pointer-events:auto;contain:strict;";
      window.__SM_INTRO = { mode: (reduced || lowTier) ? "fade" : "full", panel: panel };
      document.documentElement.appendChild(panel);
      // Safety net: if intro.js never runs (blocked/slow script/404), self-clear
      // after 3.2s so the page is never permanently curtained. Critically, this
      // ALSO dispatches sm:intro-done — bg-fx.js's WebGL loop gates on
      // that event (so it doesn't fight the intro's own canvas for main-
      // thread time) and has no other way to un-gate if
      // intro.js itself never runs to fire it. Without this dispatch, a
      // blocked/failed intro.js left the background renderer paused for the
      // ENTIRE session (found in review, not just a cosmetic gap). Dispatched
      // right away rather than after the 420ms fade so recovery isn't delayed
      // by an animation nobody asked for in this already-degraded path.
      window.__SM_INTRO.safety = setTimeout(function () {
        if (panel && panel.parentNode) {
          panel.style.transition = "opacity .4s";
          panel.style.opacity = "0";
          setTimeout(function () { panel.remove(); }, 420);
        }
        try { window.dispatchEvent(new CustomEvent("sm:intro-done")); } catch (e) { /* opportunistic */ }
      }, 3200);
    } catch (e) { /* DOM/matchMedia unavailable → just skip the intro entirely */ }
  })();
  </script>

  <!-- Fonts: Geist (display) + Inter (body) + JetBrains Mono (code) + Instrument Serif (em accents) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Geist is requested as a WEIGHT RANGE (300..700), not five fixed cuts:
       that ships the variable font, which is both smaller than five statics
       and animatable — section headings settle into their weight as they
       arrive instead of snapping between instances. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@300..700&family=Geist:wght@300..700&family=Inter:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@300;400;500;600&display=swap" />

  <!-- The intro's iris opens onto the hero photo — preload it so the porthole
       reveals a decoded image, not a late-arriving blank. Desktop only; mobile
       uses orbital-station.webp (much smaller, arrives well within 2.4s). -->
  <link rel="preload" as="image" href="assets/hero-cockpit.webp" fetchpriority="high" media="(min-width: 901px)" />

  <!-- ════════════════════════════════════════════════════════════════════
       v51 — restructured paths. All app code lives under src/:
         src/styles/   — CSS bundles
         src/engine/   — bg-fx + scene + scene-cinema + themes + motion
         src/widgets/  — interactive widgets (estimator, cli cinema)
         src/components/ — React components + main app shell
         src/content/  — i18n content
       Vendor libs (Three / React / Babel) remain in /vendor.
       ═══════════════════════════════════════════════════════════════════ -->

       is pre-compiled to plain JS by build.js, so babel-standalone is no
