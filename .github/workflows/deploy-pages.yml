name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependency graph
        run: npm audit --audit-level=high

      - name: Scan repository candidates for committed secrets
        run: npm run scan:secrets

      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build and validate generated assets
        run: npm run check:build

      - name: Verify generated files are committed
        run: |
          drift="$(git status --porcelain --untracked-files=all -- index.html src/components src/styles/app.bundle.min.css projects sitemap.xml)"
          if [ -n "$drift" ]; then
            echo "Generated drift detected:"
            echo "$drift"
            git diff -- index.html src/components src/styles/app.bundle.min.css projects sitemap.xml
            exit 1
          fi

      - name: Verify documentation contracts
        run: npm run check:docs

      - name: Run desktop, mobile and accessibility quality gate
        run: npm test

      - name: Run isolated desktop and mobile performance budgets
        run: npm run test:performance

      - name: Disable Jekyll
        run: touch .nojekyll

      - name: Prepare static artifact
        run: |
          mkdir -p _site/vendor
          cp index.html 404.html robots.txt sitemap.xml .nojekyll favicon.svg og-image.png _site/
          cp -R assets projects src _site/
          cp vendor/three.min.js vendor/react.production.min.js vendor/react-dom.production.min.js _site/vendor/

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  verify-production:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium smoke runtime
        run: npx playwright install --with-deps chromium

      - name: Verify deployed main and every generated case route
        run: npm run test:production

      - name: Verify all external live products
        run: npm run check:live
