name: Portfolio quality gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependency graph
        run: npm audit --audit-level=high

      - name: Scan repository candidates for committed secrets
        run: npm run scan:secrets

      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build and validate generated assets
        run: npm run check:build

      - name: Verify generated files are committed
        run: |
          drift="$(git status --porcelain --untracked-files=all -- index.html src/components projects sitemap.xml)"
          if [ -n "$drift" ]; then
            echo "Generated drift detected:"
            echo "$drift"
            git diff -- index.html src/components projects sitemap.xml
            exit 1
          fi

      - name: Verify documentation contracts
        run: npm run check:docs

      - name: Run desktop, mobile and accessibility quality gate
        run: npm test

      - name: Run isolated desktop and mobile performance budgets
        run: npm run test:performance

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: test-results/report/
          retention-days: 7
