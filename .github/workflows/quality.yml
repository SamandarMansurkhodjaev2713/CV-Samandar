name: Portfolio quality gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependency graph
        run: npm audit --audit-level=high

      - name: Scan repository candidates for committed secrets
        run: npm run scan:secrets

      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build and validate generated assets
        run: npm run check:build

      - name: Verify generated files are committed
        run: |
          drift="$(git status --porcelain --untracked-files=all -- index.html src/components projects sitemap.xml)"
          if [ -n "$drift" ]; then
            echo "Generated drift detected:"
            echo "$drift"
            git diff -- index.html src/components projects sitemap.xml
            exit 1
          fi

      - name: Verify documentation contracts
        run: npm run check:docs

      - name: Run desktop, mobile and accessibility quality gate
        run: npm test

      - name: Run isolated desktop and mobile performance budgets
        run: npm run test:performance

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: test-results/report/
          retention-days: 7
