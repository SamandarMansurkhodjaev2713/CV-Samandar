name: Production health monitor

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout deployed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium monitor runtime
        run: npx playwright install --with-deps chromium

      - name: Run production functional smoke
        run: npm run test:production

      - name: Measure synthetic production vitals
        run: npm run monitor:production

      - name: Verify external live products
        run: npm run check:live

      - name: Preserve production monitor evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-monitor-${{ github.run_id }}
          path: tmp/production-monitor/metrics.json
          if-no-files-found: warn
          retention-days: 14
