name: Production health monitor

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout deployed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium monitor runtime
        run: npx playwright install --with-deps chromium

      - name: Run production functional smoke
        run: npm run test:production

      - name: Measure synthetic production vitals
        run: npm run monitor:production

      - name: Verify external live products
        run: npm run check:live

      - name: Preserve production monitor evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-monitor-${{ github.run_id }}
          path: tmp/production-monitor/metrics.json
          if-no-files-found: warn
          retention-days: 14
